<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Editar Contraseña - {{ site }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="header">
    <h1>Editar Contraseña</h1>
  </div>
  <div class="container">
    <form method="POST">
      <label>Sitio/Web:</label><br>
      <input type="text" name="site" value="{{ site }}" required><br>
      <label>Usuario:</label><br>
      <input type="text" name="username" value="{{ username }}" required><br>
      <label>Contraseña:</label><br>
      <input type="password" name="password" value="{{ password }}" required><br>
      <button type="submit">Actualizar</button>
      <a href="{{ url_for('index') }}" style="margin-left:10px">Cancelar</a>
    </form>
  </div>
</body>
</html>
