<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Administrador de Contraseñas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="header">
    <h1>Administrador de Contraseñas</h1>
  </div>
  <div class="container">
    <form method="POST">
      <label>Sitio/Web:</label><br>
      <input type="text" name="site" required><br>
      <label>Usuario:</label><br>
      <input type="text" name="username" required><br>
      <label>Contraseña:</label><br>
      <input type="password" name="password" required><br>
      <button type="submit">Guardar</button>
    </form>

    {% if passwords %}
    <table>
      <tr>
        <th>Sitio</th><th>Usuario</th><th colspan="3">Acciones</th>
      </tr>
      {% for site, cred in passwords.items() %}
      <tr>
        <td>{{ site }}</td>
        <td>{{ cred.username }}</td>
        <td><a href="{{ url_for('view_password', site=site) }}">Ver</a></td>
        <td><a href="{{ url_for('edit_password', site=site) }}">Editar</a></td>
        <td>
          <form action="{{ url_for('delete_password', site=site) }}" method="post" style="display:inline">
            <button type="submit" onclick="return confirm('¿Eliminar {{site}}?')">Borrar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}
  </div>
</body>
</html>
